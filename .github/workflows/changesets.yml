name: changesets

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN stays read-only. The version PR is written with a short-lived
    # token from the developmentsprint-changesets GitHub App, because events made
    # with GITHUB_TOKEN never trigger the required pull_request checks.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Minted after install so install-time lifecycle scripts never see it.
      # Scoped to this repository and two permissions; revoked when the job ends.
      # changesets/action passes it to the version script as GITHUB_TOKEN, so
      # that command can read it: keep `version-packages` to plain
      # `changeset version`, with no installs, hooks or third-party tools.
      - name: Mint version PR token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 only accepts a custom token through this input, and fails if a
          # different GITHUB_TOKEN env var is set.
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          version-script: pnpm version-packages
          # Commits go through the GitHub API as the App (v2 default): signed,
          # and no git push credential is needed. No publish-script is set, so
          # nothing is published, tagged or released here.
          create-github-releases: false
          push-git-tags: false
